project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "day1/*.qmd"
    - "day2/*.qmd"
    - "day3/*.qmd"
    - "reference/*.qmd"
    - "slides/*.qmd"
  preview:
    port: 4731

