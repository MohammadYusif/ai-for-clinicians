format:
  html:
    lang: en
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    anchor-sections: true
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    code-line-numbers: false
    link-external-icon: true
    link-external-newwindow: true
    include-after-body: assets/copy-prompts.html
    respect-user-color-scheme: true
    theme:
      light: [cosmo, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    mermaid:
      theme: neutral

# Nothing on this site executes: every code block is either read or copied into an
# AI tool by a participant. Example outputs are illustrative and labeled as such;
# no page states a measurement the repository cannot back (see CLAUDE.md).
execute:
  enabled: false

lightbox: auto
