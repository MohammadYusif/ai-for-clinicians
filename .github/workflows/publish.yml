name: Publish the course site

# Runs the repository's own checks, renders the site, audits every internal link in the
# rendered HTML, and (on main only) deploys to GitHub Pages. Nothing here needs a key or
# a network service beyond GitHub: the site executes no code (execute: enabled: false).
#
# The Pages steps run only while the repository is public. A private repository on a plan
# without private Pages has no Pages site to configure, and configure-pages fails there.
# To publish: make the repository public, then Settings > Pages > Source: GitHub Actions.
# The runner is pinned: GitHub moves ubuntu-latest to Ubuntu 26 on 2026-10-19.

on:
  push:
    branches: [main]
    paths:
      - "*.qmd"
      - "day1/**"
      - "day2/**"
      - "day3/**"
      - "reference/**"
      - "course/timing.json"
      - "_quarto.yml"
      - "theme-*.scss"
      - "_components.scss"
      - "assets/**"
      - "tools/**"
      - ".github/workflows/publish.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: The clock adds up (every day is 120 minutes, every badge matches)
        run: python3 tools/check_timing.py --quiet

      - name: The prompt library matches the pages that teach the prompts
        run: python3 tools/build_prompt_library.py --check

      - name: No unfinished placeholders in published pages
        run: python3 tools/check_placeholders.py

      - name: Canonical wording present, banned claims absent, one "Keep this" per timed section
        run: python3 tools/lint_content.py

      - name: Render
        run: quarto render

      - name: "Every internal link and #fragment resolves in the rendered site"
        run: python3 tools/check_links.py

      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main' && github.event.repository.private == false
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event.repository.private == false
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
